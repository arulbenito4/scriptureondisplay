<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="Preview of the 2027 Scripture on Display wall calendar">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C89A"/>
      <stop offset="0.55" stop-color="#E9A27A"/>
      <stop offset="1" stop-color="#B9667A"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E7FA0"/>
      <stop offset="1" stop-color="#2E4A66"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#3A1A20" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- hanger -->
  <line x1="400" y1="8" x2="330" y2="58" stroke="#7A1E2C" stroke-width="3"/>
  <line x1="400" y1="8" x2="470" y2="58" stroke="#7A1E2C" stroke-width="3"/>
  <circle cx="400" cy="8" r="6" fill="#C9962E"/>
  <g filter="url(#shadow)">
    <!-- upper photo page -->
    <rect x="80" y="54" width="640" height="280" fill="#FFFFFF"/>
    <rect x="96" y="70" width="608" height="248" fill="url(#sky)"/>
    <circle cx="560" cy="170" r="34" fill="#FBE3B8" opacity="0.9"/>
    <path d="M96 238 L190 168 L250 206 L330 140 L420 214 L500 178 L600 230 L704 192 L704 318 L96 318 Z" fill="#6E4A5C" opacity="0.75"/>
    <path d="M96 262 L170 224 L262 250 L360 212 L470 252 L560 232 L704 262 L704 318 L96 318 Z" fill="url(#sea)"/>
    <path d="M96 300 C200 290 300 296 400 292 C520 288 600 296 704 292 L704 318 L96 318 Z" fill="#20354B"/>
    <text x="400" y="110" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="22" fill="#FFFFFF">"Your word is a lamp to my feet and a light to my path."</text>
    <text x="400" y="136" text-anchor="middle" font-family="'Josefin Sans', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#FFFFFF">PSALM 119:105</text>
    <!-- binding -->
    <rect x="80" y="334" width="640" height="10" fill="#E9E1D3"/>
    <g fill="#9A9A9A">
      <circle cx="160" cy="339" r="3"/><circle cx="240" cy="339" r="3"/><circle cx="320" cy="339" r="3"/><circle cx="400" cy="339" r="3"/><circle cx="480" cy="339" r="3"/><circle cx="560" cy="339" r="3"/><circle cx="640" cy="339" r="3"/>
    </g>
    <!-- lower month page -->
    <rect x="80" y="344" width="640" height="276" fill="#FFFFFF"/>
    <text x="110" y="384" font-family="'Arizonia', cursive" font-size="34" fill="#7A1E2C">January</text>
    <text x="690" y="380" text-anchor="end" font-family="'Josefin Sans', Arial, sans-serif" font-size="16" letter-spacing="4" fill="#8A5F12">2027</text>
    <g font-family="'Josefin Sans', Arial, sans-serif" font-size="11" letter-spacing="2" fill="#7A1E2C" text-anchor="middle">
      <text x="152" y="410">SUN</text><text x="238" y="410">MON</text><text x="324" y="410">TUE</text><text x="410" y="410">WED</text><text x="496" y="410">THU</text><text x="582" y="410">FRI</text><text x="668" y="410">SAT</text>
    </g>
    <g stroke="#EADFCB" stroke-width="1">
      <line x1="110" y1="418" x2="710" y2="418"/><line x1="110" y1="458" x2="710" y2="458"/><line x1="110" y1="498" x2="710" y2="498"/><line x1="110" y1="538" x2="710" y2="538"/><line x1="110" y1="578" x2="710" y2="578"/>
    </g>
    <g font-family="'Cormorant Garamond', Georgia, serif" font-size="15" fill="#3B2A2E" text-anchor="middle">
      <text x="582" y="436">1</text><text x="668" y="436">2</text>
      <text x="152" y="476">3</text><text x="238" y="476">4</text><text x="324" y="476">5</text><text x="410" y="476">6</text><text x="496" y="476">7</text><text x="582" y="476">8</text><text x="668" y="476">9</text>
      <text x="152" y="516">10</text><text x="238" y="516">11</text><text x="324" y="516">12</text><text x="410" y="516">13</text><text x="496" y="516">14</text><text x="582" y="516">15</text><text x="668" y="516">16</text>
      <text x="152" y="556">17</text><text x="238" y="556">18</text><text x="324" y="556">19</text><text x="410" y="556">20</text><text x="496" y="556">21</text><text x="582" y="556">22</text><text x="668" y="556">23</text>
      <text x="152" y="596">24</text><text x="238" y="596">25</text><text x="324" y="596">26</text><text x="410" y="596">27</text><text x="496" y="596">28</text><text x="582" y="596">29</text><text x="668" y="596">30</text>
    </g>
